name: Deploy Watchdog

# Guards the failure mode where merges land green and production never
# changes. On 2026-09-14/15 Vercel's free-tier cap of 100 deployments per day
# was exhausted across the account, so pushes to main were silently dropped —
# no deployment, no error, and healthcalc served a stale build for two days.
# deploy-check.yml watches each push for twelve minutes; this is the daily
# backstop for anything it missed or that broke later, and it fails loudly
# when the newest default-branch commit has no successful Production
# deployment attached.
#
# Vercel records each deploy as a GitHub Deployment (environment "Production")
# on the deployed commit, so this needs only the repo's own API — no Vercel
# token, nothing to rotate.

on:
  schedule:
    - cron: "23 9 * * *" # daily; a scheduled failure emails the workflow's author
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  verify:
    name: Latest main commit has a live Production deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check newest commit for a successful Production deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            const branch = repoInfo.default_branch;
            const { data: head } = await github.rest.repos.getCommit({ owner, repo, ref: branch });

            const ageMinutes = (Date.now() - new Date(head.commit.committer.date)) / 60000;
            core.info(`${branch} head: ${head.sha} (${Math.round(ageMinutes)} min old)`);

            // A build takes ~2 minutes; give a fresh merge generous headroom
            // before declaring the pipeline broken.
            if (ageMinutes < 45) {
              core.info('Commit is fresh; a deploy may still be in flight. Passing.');
              return;
            }

            // vercel.json's ignoreCommand (scripts/vercel-ignore-build.sh) skips
            // the build when a commit changes only docs, tests or CI files.
            // Vercel then attaches no deployment and marks the commit's Vercel
            // status "Ignored Build Step", and production keeps the previous
            // build. Check the newest commit Vercel actually built instead.
            let sha = head.sha;
            for (let i = 0; i < 30; i++) {
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: sha,
              });
              const vercel = combined.statuses.filter((s) => s.context.startsWith('Vercel'));
              const skipped = vercel.length > 0 &&
                vercel.every((s) => /Ignored Build Step/i.test(s.description ?? ''));
              if (!skipped) break;
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
              if (commit.parents.length === 0) break;
              core.info(`${sha.slice(0, 7)}: Vercel skipped it (Ignored Build Step); checking its parent.`);
              sha = commit.parents[0].sha;
            }

            const { data: deployments } = await github.rest.repos.listDeployments({
              owner, repo, sha: sha, environment: 'Production', per_page: 5,
            });
            if (deployments.length === 0) {
              core.setFailed(
                `No Production deployment exists for ${branch}@${sha.slice(0, 7)}. ` +
                'This is what the 2026-09-14/15 outage looked like: Vercel hit its 100 deploys/day ' +
                'cap, merges landed, nothing deployed. Check the Vercel dashboard for dropped ' +
                'deployments and the Git connection (vercel git connect); redeploy by hand with ' +
                '`npx vercel deploy --prod --yes --scope gr8monk3ys-projects` from a clean main.'
              );
              return;
            }

            const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
              owner, repo, deployment_id: deployments[0].id, per_page: 1,
            });
            const state = statuses[0]?.state ?? 'missing';
            if (state !== 'success') {
              core.setFailed(
                `Production deployment for ${sha.slice(0, 7)} is '${state}', not 'success'. ` +
                'Inspect the deployment in Vercel.'
              );
              return;
            }
            core.info(`Production deployment ${deployments[0].id} is live. All good.`);
