permissions: read-all

name: CI

# Cancel superseded in-flight runs for the same ref (but never on main,
# where every commit's run should complete).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remedi
          POSTGRES_PASSWORD: remedi_dev
          POSTGRES_DB: remedi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remedi -d remedi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://remedi:remedi_dev@localhost:5432/remedi?schema=public
      AUTH_SECRET: ci-auth-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        run: bun install
      - name: Prisma generate
        run: bunx prisma generate
      - name: Migrate + seed
        run: bunx prisma migrate dev && SEED_DEMO=true bunx prisma db seed
      - name: DB verify
        run: bun run db:verify
      - name: Data integrity checks
        run: bun run db:integrity
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run type-check
      - name: Type check tests
        run: bun run type-check:tests
      - name: Dead code check
        run: bun run knip
      - name: Unit tests
        run: bun run test:run
      # These exercise the real database rather than a mock. They existed for
      # months without a runner: no script, no CI step, so a whole file had
      # rotted against the current getFavorites signature unnoticed.
      - name: Integration tests
        run: bun run test:integration

  # Guards the exact failure that shipped an unstyled site: a production build
  # whose only stylesheet contained custom properties and no Tailwind utilities.
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://remedi:remedi_dev@localhost:5432/remedi?schema=public
      AUTH_SECRET: ci-auth-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_SECRET_KEY: sk_test_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        run: bun install
      - name: Prisma generate
        run: bunx prisma generate
      - name: Next build
        run: bunx next build
      - name: Built CSS has Tailwind utilities
        run: bun run check:css

  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remedi
          POSTGRES_PASSWORD: remedi_dev
          POSTGRES_DB: remedi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remedi -d remedi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://remedi:remedi_dev@localhost:5432/remedi?schema=public
      AUTH_SECRET: ci-auth-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        run: bun install
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps
      - name: Prisma generate
        run: bunx prisma generate
      - name: Migrate + seed
        run: bunx prisma migrate dev && SEED_DEMO=true bunx prisma db seed
      - name: Run E2E tests
        run: bun run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report

  readiness:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [test, e2e]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remedi
          POSTGRES_PASSWORD: remedi_dev
          POSTGRES_DB: remedi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remedi -d remedi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://remedi:remedi_dev@localhost:5432/remedi?schema=public
      AUTH_SECRET: ci-auth-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_SECRET_KEY: sk_test_ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_PUBLISHABLE_KEY: pk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      STRIPE_BASIC_MONTHLY_PRICE_ID: price_basic_monthly
      STRIPE_BASIC_YEARLY_PRICE_ID: price_basic_yearly
      STRIPE_PREMIUM_MONTHLY_PRICE_ID: price_premium_monthly
      STRIPE_PREMIUM_YEARLY_PRICE_ID: price_premium_yearly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        run: bun install
      - name: Prisma generate
        run: bunx prisma generate
      - name: Migrate + seed
        run: bunx prisma migrate dev && SEED_DEMO=true bunx prisma db seed
      - name: Production readiness check
        run: bun run prod:check

  # Holds the Lighthouse scores the 2026-09-13..16 performance work reached
  # (inlined stylesheet, animation gates, font swap, Sentry idle-load) and a
  # byte budget on the home document. Floors live in
  # scripts/check-lighthouse-score.mjs and are measured, not aspirational.
  # The job name is what branch protection would key on; keep it stable.
  lighthouse:
    name: Lighthouse (score floors)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remedi
          POSTGRES_PASSWORD: remedi_dev
          POSTGRES_DB: remedi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remedi -d remedi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://remedi:remedi_dev@localhost:5432/remedi?schema=public
      AUTH_SECRET: ci-auth-secret
      # 127.0.0.1, not localhost, and it must stay in step with the host
      # `bun run lighthouse:ci` browses. This value becomes `metadataBase`, so
      # it is the origin of every canonical URL in the build; Lighthouse's
      # `canonical` audit only flags a page whose canonical points at the site
      # root when that canonical shares an origin with the page it is auditing.
      # The localhost/127.0.0.1 split silently disabled that check, and a
      # site-wide canonical pointing at the homepage sailed through this job.
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_SECRET_KEY: sk_test_ci
      # The same Clerk stub the e2e job runs under: clerkMiddleware refuses
      # the placeholder keys above, and a real key would load Clerk's runtime
      # from a domain this runner cannot reach. SKIP_ENV_VALIDATION is what
      # lets the stub run against a production build.
      E2E_LOCAL_AUTH: "true"
      E2E_DISABLE_SENTRY: "true"
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        run: bun install
      - name: Prisma generate
        run: bunx prisma generate
      - name: Migrate + seed
        run: bunx prisma migrate dev && SEED_DEMO=true bunx prisma db seed
      - name: Next build
        run: bunx next build
      - name: Start application
        run: |
          bunx next start -p 3000 > /tmp/remedi.log 2>&1 &
          echo $! > /tmp/remedi.pid
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/remedi.log
          exit 1
      - name: Enforce Lighthouse scores
        run: bun run lighthouse:ci
      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lighthouse-artifacts
          path: artifacts/lighthouse
          retention-days: 7
      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/remedi.pid ]; then
            kill "$(cat /tmp/remedi.pid)" || true
          fi
          cat /tmp/remedi.log || true
