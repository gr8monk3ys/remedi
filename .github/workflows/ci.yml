permissions: read-all

name: CI

# Cancel superseded in-flight runs for the same ref (but never on main,
# where every commit's run should complete).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:

env:
  # verify_summary.py writes <stage>.json here; merged by the verify-report job.
  VERIFY_STAGE_DIR: verify-stages

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remedi
          POSTGRES_PASSWORD: remedi_dev
          POSTGRES_DB: remedi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remedi -d remedi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://remedi:remedi_dev@localhost:5432/remedi?schema=public
      AUTH_SECRET: ci-auth-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        run: bun install
      - name: Prisma generate
        run: bunx prisma generate
      - name: Migrate + seed
        run: bunx prisma migrate dev && SEED_DEMO=true bunx prisma db seed
      # db:verify, db:integrity, format, lint, type-check (app + tests), knip,
      # unit tests, then the integration tests that exercise the real database
      # rather than a mock (they once rotted unnoticed for months with no runner).
      - name: Verify (checks, unit + integration tests)
        run: bun run verify:check
      - name: Test-count evidence
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/verify_summary.py unit reports/unit.json
          python3 scripts/verify_summary.py integration reports/integration.json
      - name: Upload VERIFY stage counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verify-stage-test
          path: verify-stages/
          retention-days: 1

  # Guards the exact failure that shipped an unstyled site: a production build
  # whose only stylesheet contained custom properties and no Tailwind utilities.
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://remedi:remedi_dev@localhost:5432/remedi?schema=public
      AUTH_SECRET: ci-auth-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_SECRET_KEY: sk_test_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        run: bun install
      - name: Prisma generate
        run: bunx prisma generate
      - name: Next build + built CSS has Tailwind utilities
        run: bun run verify:build

  e2e:
    timeout-minutes: 30
    # Pinned: ubuntu-latest is now 26.04 and this repo's Playwright has no browser
    # build for it. Go back to ubuntu-latest after a Playwright upgrade (1.64.1 works).
    runs-on: ubuntu-24.04
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remedi
          POSTGRES_PASSWORD: remedi_dev
          POSTGRES_DB: remedi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remedi -d remedi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://remedi:remedi_dev@localhost:5432/remedi?schema=public
      AUTH_SECRET: ci-auth-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        run: bun install
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps
      - name: Prisma generate
        run: bunx prisma generate
      - name: Migrate + seed
        run: bunx prisma migrate dev && SEED_DEMO=true bunx prisma db seed
      - name: Run E2E tests
        run: bun run verify:e2e
      - name: Test-count evidence
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_summary.py e2e reports/e2e.json
      - name: Upload VERIFY stage counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verify-stage-e2e
          path: verify-stages/
          retention-days: 1
      - name: Upload UI evidence (screenshots + traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-evidence
          path: test-results
          if-no-files-found: error
      - name: List UI evidence in the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### ui-evidence artifact"
            echo
            find test-results -type f \( -name '*.png' -o -name 'trace.zip' \) | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: playwright-report

  readiness:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [test, e2e]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remedi
          POSTGRES_PASSWORD: remedi_dev
          POSTGRES_DB: remedi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remedi -d remedi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://remedi:remedi_dev@localhost:5432/remedi?schema=public
      AUTH_SECRET: ci-auth-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_SECRET_KEY: sk_test_ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_PUBLISHABLE_KEY: pk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      STRIPE_BASIC_MONTHLY_PRICE_ID: price_basic_monthly
      STRIPE_BASIC_YEARLY_PRICE_ID: price_basic_yearly
      STRIPE_PREMIUM_MONTHLY_PRICE_ID: price_premium_monthly
      STRIPE_PREMIUM_YEARLY_PRICE_ID: price_premium_yearly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        run: bun install
      - name: Prisma generate
        run: bunx prisma generate
      - name: Migrate + seed
        run: bunx prisma migrate dev && SEED_DEMO=true bunx prisma db seed
      - name: Production readiness check
        run: bun run prod:check

  # Holds the Lighthouse scores the 2026-09-13..16 performance work reached
  # (inlined stylesheet, animation gates, font swap, Sentry idle-load) and a
  # byte budget on the home document. Floors live in
  # scripts/check-lighthouse-score.mjs and are measured, not aspirational.
  # The job name is what branch protection would key on; keep it stable.
  lighthouse:
    name: Lighthouse (score floors)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remedi
          POSTGRES_PASSWORD: remedi_dev
          POSTGRES_DB: remedi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remedi -d remedi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://remedi:remedi_dev@localhost:5432/remedi?schema=public
      AUTH_SECRET: ci-auth-secret
      # 127.0.0.1, not localhost, and it must stay in step with the host
      # `bun run lighthouse:ci` browses. This value becomes `metadataBase`, so
      # it is the origin of every canonical URL in the build; Lighthouse's
      # `canonical` audit only flags a page whose canonical points at the site
      # root when that canonical shares an origin with the page it is auditing.
      # The localhost/127.0.0.1 split silently disabled that check, and a
      # site-wide canonical pointing at the homepage sailed through this job.
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_SECRET_KEY: sk_test_ci
      # The same Clerk stub the e2e job runs under: clerkMiddleware refuses
      # the placeholder keys above, and a real key would load Clerk's runtime
      # from a domain this runner cannot reach. SKIP_ENV_VALIDATION is what
      # lets the stub run against a production build.
      E2E_LOCAL_AUTH: "true"
      E2E_DISABLE_SENTRY: "true"
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.8
      - name: Install dependencies
        run: bun install
      - name: Prisma generate
        run: bunx prisma generate
      - name: Migrate + seed
        run: bunx prisma migrate dev && SEED_DEMO=true bunx prisma db seed
      - name: Next build
        run: bunx next build
      - name: Start application
        run: |
          bunx next start -p 3000 > /tmp/remedi.log 2>&1 &
          echo $! > /tmp/remedi.pid
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/remedi.log
          exit 1
      - name: Enforce Lighthouse scores
        run: bun run lighthouse:ci
      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lighthouse-artifacts
          path: artifacts/lighthouse
          retention-days: 7
      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/remedi.pid ]; then
            kill "$(cat /tmp/remedi.pid)" || true
          fi
          cat /tmp/remedi.log || true

  verify-report:
    # Merges every job's VERIFY stage counts into one machine-readable artifact for the merge gate
    # (job summaries aren't readable via the REST API). Fails if any expected stage is missing.
    name: Verify Report
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: always()

    steps:
      - name: Download stage counts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: verify-stage-*
          path: verify-stages
          merge-multiple: true

      - name: Merge into verify-report.json
        env:
          EXPECTED_STAGES: unit integration e2e
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for s in $EXPECTED_STAGES; do
            f="verify-stages/$s.json"
            [ -f "$f" ] || { echo "::error::missing VERIFY stage '$s'"; exit 1; }
            jq -e --arg s "$s" '.stage == $s and ([.tests, .passed, .failed, .skipped] | all(type == "number" and . == floor and . >= 0))
              and (.passed_ids | type == "array" and all(type == "string"))' "$f" > /dev/null \
              || { echo "::error::unparseable VERIFY stage '$s'"; cat "$f"; exit 1; }
          done
          jq -n --arg repo "$REPO" --arg commit "$COMMIT" '{schema: 1, repo: $repo, commit: $commit, stages: [inputs | .passed_ids |= (unique | sort)]}' \
            $(for s in $EXPECTED_STAGES; do echo "verify-stages/$s.json"; done) > verify-report.json
          cat verify-report.json

      - name: Upload verify-report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verify-report
          path: verify-report.json
          retention-days: 30
