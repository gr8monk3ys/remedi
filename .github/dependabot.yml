version: 2
updates:
  # Enable version updates for npm
  # npm version bumps handled by the dep-hygiene loop (Dependabot can't regen bun.lock)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      development-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      # codeql-action/{init,autobuild,analyze} are one action published from
      # one repo and only work when all three run at the same version.
      # Ungrouped, Dependabot raises a separate PR per path and they land
      # piecemeal, leaving the workflow mismatched and every run failing with
      # a configuration error.
      codeql-action:
        patterns:
          - "github/codeql-action*"
