# Dependabot retune 2026-09-10: this repo is deployed, so version updates stay on,
# but monthly with a small PR cap. Security updates are a repo setting and unaffected.
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  groups:
    development-dependencies:
      dependency-type: development
    production-dependencies:
      dependency-type: production
  ignore:
  # TypeScript 7 is the native port; typescript-eslint 8 and Next 16 cannot load
  # it (#144 failed lint and build on it). Re-enable when they can.
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  groups:
    codeql-action:
      patterns:
      - github/codeql-action*
